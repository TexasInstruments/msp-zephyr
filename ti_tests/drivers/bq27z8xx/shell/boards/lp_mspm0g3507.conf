# The shell test handlers (status, lifetime, ra_table, reg_read) allocate
# large local buffers totalling several hundred bytes of stack per call.
# The default ZTEST_STACK_SIZE of 1024 B is insufficient; 2048 B provides
# enough headroom for the deepest call chains on this 32 KB device.
CONFIG_ZTEST_STACK_SIZE=2048
