CONFIG_ZTEST=y
CONFIG_I2C=y
CONFIG_GPIO=y

# I2C SCL low timeout (cumulative low period during transaction)
# Set to 100ms to detect hung I2C bus or excessive clock stretching
# CONFIG_I2C_SCL_LOW_TIMEOUT=100

# Enable dynamic threading for timeout implementation
CONFIG_DYNAMIC_THREAD=y

CONFIG_I2C_TRANSFER_TIMEOUT_MSEC=10000

# Ztest configuration
# CONFIG_ZTEST_NEW_API=y
# CONFIG_ZTEST_ASSERT_VERBOSE=1
