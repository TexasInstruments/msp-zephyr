source [find interface/xds110.cfg]
adapter speed 10000

# --- MSPM33 Flash Boot Fix ---
#
# Problem: The MSPM33 boot ROM checks FRCACT (Force Active, bit 3 in
# PWR_AP::DPREC). When FRCACT is set, the boot ROM enters a debug wait
# loop instead of jumping to the flash application. OpenOCD's examine-start
# handler (_mspm33_enable_low_power_mode) sets FRCACT on every connect,
# including reconnects after 'reset run'. This prevents firmware from
# booting after flash.
#
# Solution: A two-part fix:
# 1. Skip examine-start handler on the 'reset run' reconnect (via flag).
# 2. After 'reset run', use a reset-end event to clear FRCACT and trigger
#    a clean SYSRST via PWR_AP. The boot ROM then boots without seeing
#    debug mode and jumps to the flash application normally.

set ::_mspm33_skip_examine 0

proc _mspm33_conditional_examine { } {
    if { $::_mspm33_skip_examine } {
        return
    }
    _mspm33_enable_low_power_mode
}

proc _mspm33_clean_boot_reset { } {
    if { !$::_mspm33_skip_examine } {
        return
    }
    # Clear FRCACT: set DPREC to IHIB_SLP(20)=1 only, no FRCACT(3)
    $::_CHIPNAME.dap apreg 4 0x00 0x100000
    # Trigger SYSRST via PWR_AP so the chip resets with FRCACT=0
    $::_CHIPNAME.dap apreg 4 0xF0 0x01
}

source [find target/ti_mspm33.cfg]

# Override examine-start with conditional version
mspm33.cpu configure -event examine-start { _mspm33_conditional_examine }

# After 'reset run', clear FRCACT and trigger a clean SYSRST so the
# boot ROM boots into the flash application
mspm33.cpu configure -event reset-end { _mspm33_clean_boot_reset }
