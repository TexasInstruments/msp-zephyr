description: TI MSP oscillator

compatible: "ti,msp-osc"

include: [fixed-clock.yaml, base.yaml]

properties:
  "#clock-cells":
    const: 0

  ti,xtal-startup-delay-us:
    type: int
    description: |
      Crystal Oscillator startup delay in micro seconds.

  ti,low-cap:
    type: boolean
    description: |
      Specifies if capacitance is less than 3pF to reduce power consumption.

  ti,drive-strength:
    type: int
    description: |
      Drive strength setting for the oscillator. Valid range [0 ... 3].
      Higher value means higher drive strength.

  ti,monitor-enable:
    type: int
    description: |
      Enable clock monitoring circuit to detect clock failures.
