description: TI MSP Clock

compatible: "ti,msp-clk"

include: [clock-controller.yaml, base.yaml]

properties:
  "#clock-cells":
    const: 1

  clock-frequency:
    type: int
    description: |
      Output clock frequency in Hz.

  clk-div:
    type: int
    description: |
      Clock divider selection value. Valid range [2, 4, 6, 8, 10, 12, 14, 16]

clock-cells:
  - clk
