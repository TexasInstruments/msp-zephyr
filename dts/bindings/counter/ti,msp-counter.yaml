description: |
  TI MSP counter node for MSP SoCs. Each timer can be configured to use for
  counter operation.

  mspcounter : counter {
    counter_0 {
      resolution = <16>;
    };
  };

compatible: "ti,msp-timer-counter"

include: base.yaml

properties:
  resolution:
    type: int
    required: true
    description: |
      Counter resolution
