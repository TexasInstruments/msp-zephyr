description: TI MSP CANFD

compatible: "ti,msp-canfd"

include: ["bosch,m_can-base.yaml", "pinctrl-device.yaml"]

properties:
  reg:
    required: true

  interrupts:
    required: true

  clocks:
    required: true

  clock-frequency:
    required: true
    type: int
    description: |
      Desired MCAN functional clock frequency (MCAN_FCLK) in Hz.
