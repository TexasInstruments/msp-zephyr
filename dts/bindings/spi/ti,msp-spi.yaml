description: |
   Texas Instruments MSP SERIAL PERIPHERAL INTERFACE (SPI).

compatible: "ti,msp-spi"

include: [spi-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

  pinctrl-0:
    required: true

  pinctrl-names:
    required: true

  ti,clk-div:
    type: int
    default: 1
    enum:
      - 1
      - 2
      - 3
      - 4
      - 5
      - 6
      - 7
      - 8

  hw-chip-select:
    type: string
    default: "DL_SPI_CHIP_SELECT_NONE"
    enum:
      - "DL_SPI_CHIP_SELECT_NONE"
      - "DL_SPI_CHIP_SELECT_0"
      - "DL_SPI_CHIP_SELECT_1"
      - "DL_SPI_CHIP_SELECT_2"
      - "DL_SPI_CHIP_SELECT_3"
    description: |
      Use dedicated hardware chip select pin. The selected signal is controlled
      automatically during transfer.
