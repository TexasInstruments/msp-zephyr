description: TI MSP HSADC

compatible: "ti,msp-hsadc"

include: [adc-controller.yaml, pinctrl-device.yaml]

properties:
  reg:
    required: true
    description: |
      Register space for the ADC. Should contain two entries:
      - First entry for configuration registers (ADC_LITE_REGS)
      - Second entry for result registers (ADC_LITE_RESULT_REGS)

  reg-names:
    required: true
    description: |
      Names for the register spaces. Must include:
      - "config" for the configuration registers
      - "result" for the result registers

  interrupts:
    required: true

  pinctrl-0:
    required: false

  pinctrl-names:
    required: false

  "#io-channel-cells":
    const: 1

  ti,clk-divider:
    type: int
    required: true
    enum:
      - 0  # ADCCLK = (internal clock) / 1.0
      - 1  # ADCCLK = (internal clock) / 1.5
      - 2  # ADCCLK = (internal clock) / 2.0
      - 3  # ADCCLK = (internal clock) / 2.5
      - 4  # ADCCLK = (internal clock) / 3.0
      - 5  # ADCCLK = (internal clock) / 3.5
      - 6  # ADCCLK = (internal clock) / 4.0
      - 7  # ADCCLK = (internal clock) / 4.5
      - 8  # ADCCLK = (internal clock) / 5.0
      - 9  # ADCCLK = (internal clock) / 5.5
      - 10 # ADCCLK = (internal clock) / 6.0
      - 11 # ADCCLK = (internal clock) / 6.5
      - 12 # ADCCLK = (internal clock) / 7.0
      - 13 # ADCCLK = (internal clock) / 7.5
      - 14 # ADCCLK = (internal clock) / 8.0
      - 15 # ADCCLK = (internal clock) / 8.5
    description: |
      ADC clock divider:
      Applies to the internal ADC clock.

  ti,sample-window:
    type: int
    default: 64
    description: Sample window in ADC clock cycles

  vref-mv:
    type: int
    default: 3300
    description: |
      Reference voltage in millivolts for ADC raw-to-voltage conversion.
      This value must match the selected ti,vref-source:
        - If ti,vref-source = 0 (VDDA): Set to board VDD voltage (typically 3300)
        - If ti,vref-source = 1: Must be 2500 (internal 2.5V reference)
        - If ti,vref-source = 2: Must be 1400 (internal 1.4V reference)

      This property is used by adc_ref_internal() API and raw-to-millivolts
      conversion functions.

  ti,vref-source:
    type: int
    default: 0
    enum:
      - 0  # VDDA reference voltage (default)
      - 1  # Internal 2.5V reference
      - 2  # Internal 1.4V reference
    description: |
      Selects the hardware reference voltage source for the ADC.
        - 0: VDDA (board supply voltage, typically 3.3V)
        - 1: Internal 2.5V reference (enables on-chip VREF peripheral)
        - 2: Internal 1.4V reference (enables on-chip VREF peripheral)

      Note: The vref-mv property must be set to match this selection.
      For internal references, channels should use zephyr,reference = "ADC_REF_INTERNAL".

io-channel-cells:
  - input
